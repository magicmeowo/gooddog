// ============ 匹配算法（见 docs/decisions/matching-algorithm.md）============
const SIZE_RANK = { small:1, medium:2, large:3 };
const WEIGHTS = { exercise:1.5, alone:1.3, grooming:1.0, train:1.0, budget:1.0 };
const MAX_PENALTY = Object.values(WEIGHTS).reduce((s,w)=>s+4*w, 0); // 23.2
const DIM_LABEL = { exercise:"运动量", alone:"独处", grooming:"打理/掉毛", train:"好不好带", budget:"花销" };

function collectAnswers(picks){
  // picks: { qid: optionIndex }
  const a = { exercise:3, alone_req:3, grooming:3, train:3, budget:3,
              max_size:"large", max_noise:5, require:{}, pref:null };
  QUESTIONS.forEach(q=>{
    const opt = q.options[picks[q.id]];
    if(!opt) return;
    if(opt.scores) Object.assign(a, opt.scores);
    if(opt.filters){
      if(opt.filters.max_size) a.max_size = opt.filters.max_size;
      if(opt.filters.max_noise!=null) a.max_noise = opt.filters.max_noise;
      if(opt.filters.require_good_with_kids) a.require.kids = true;
      if(opt.filters.require_hypoallergenic) a.require.hypo = true;
    }
    if(opt.pref) a.pref = opt.pref;
  });
  return a;
}

function hardFilter(dogs, a){
  return dogs.filter(d=>{
    if(SIZE_RANK[d.size] > SIZE_RANK[a.max_size]) return false;
    if(d.filters.noise > a.max_noise) return false;
    if(a.require.kids && !d.filters.good_with_kids) return false;
    if(a.require.hypo && !d.filters.hypoallergenic) return false;
    return true;
  });
}

function scoreDog(d, a){
  // 每个维度: gap = demand - supply, gap>0 重罚, gap<=0 轻罚
  const dims = [
    { key:"exercise", demand:d.traits.exercise,        supply:a.exercise },
    { key:"alone",    demand:a.alone_req,               supply:d.traits.alone_tolerance },
    { key:"grooming", demand:d.traits.grooming,         supply:a.grooming },
    { key:"train",    demand:d.traits.train_difficulty, supply:a.train },
    { key:"budget",   demand:d.traits.budget,           supply:a.budget },
  ];
  let penalty = 0;
  const detail = [];
  dims.forEach(dim=>{
    const gap = dim.demand - dim.supply;
    const w = WEIGHTS[dim.key];
    const p = gap > 0 ? gap*w : Math.abs(gap)*w*0.2;
    penalty += p;
    detail.push({ key:dim.key, gap, penalty:p });
  });
  let score = 100 * (1 - penalty/MAX_PENALTY);
  // 喜好加分
  let prefBonus = 0;
  if(a.pref){
    if(a.pref.size && d.size===a.pref.size) prefBonus += 3;
    if(a.pref.personality && d.personality.includes(a.pref.personality)) prefBonus += 3;
  }
  score += prefBonus;
  return { score: Math.max(0, Math.min(100, Math.round(score))), detail, prefBonus };
}

function explain(d, detail){
  // 命中点: gap<=0 选 2 条; 注意点: gap 最大那条
  const good = detail.filter(x=>x.gap<=0).sort((a,b)=>a.gap-b.gap).slice(0,2);
  const worst = detail.slice().sort((a,b)=>b.gap-a.gap)[0];
  const goodTxt = good.map(g=>`你给得起「${DIM_LABEL[g.key]}」`);
  let warn = null;
  if(worst && worst.gap>0) warn = `要注意「${DIM_LABEL[worst.key]}」可能吃力`;
  return { good:goodTxt, warn, real_talk:d.real_talk };
}

function personalityTag(a){
  if(a.exercise>=4) return {tag:"出门撒野型", line:"你精力旺盛，适合能陪你一起跑跳的狗。"};
  if(a.exercise<=2 && a.alone_req<=2) return {tag:"居家暖被窝型", line:"你时间多、爱宅，最适合黏人的小棉袄。"};
  if(a.grooming<=2) return {tag:"精致洁癖型", line:"你受不了乱，得挑省心好打理的狗。"};
  if(a.budget>=4) return {tag:"富养宠妈宠爸型", line:"你舍得花，狗跟着你享福。"};
  if(a.train<=2) return {tag:"新手保命型", line:"你是新手，越省心好带的狗越合适。"};
  return {tag:"随性养狗型", line:"你比较随和，大部分狗都能处得来。"};
}

function match(picks){
  const a = collectAnswers(picks);
  let pool = hardFilter(DOGS, a);
  let relaxed = false;
  if(pool.length===0){ // 放宽体型一级保底
    relaxed = true;
    const a2 = {...a, max_size:"large"};
    pool = hardFilter(DOGS, a2);
    if(pool.length===0) pool = DOGS.slice();
  }
  const ranked = pool.map(d=>{
    const s = scoreDog(d, a);
    return { dog:d, ...s, why:explain(d, s.detail) };
  }).sort((x,y)=>y.score-x.score);
  return { top: ranked.slice(0,3), tag:personalityTag(a), relaxed, poolSize:pool.length };
}

// ============ 渲染 ============
const app = document.getElementById("app");
let picks = {};
let step = -1; // -1 落地页, 0..n-1 题目, n 结果

function render(){
  if(step===-1) return renderLanding();
  if(step>=0 && step<QUESTIONS.length) return renderQuestion();
  return renderResult();
}

function renderLanding(){
  app.innerHTML = `
    <div class="fade text-center pt-16">
      <div class="text-6xl mb-6">🐶</div>
      <h1 class="text-2xl font-bold mb-3">测测你适合养什么狗</h1>
      <p class="text-stone-500 mb-1">9 道小题，3 分钟，告诉你哪只狗最适合你的生活。</p>
      <p class="text-stone-400 text-sm mb-10">不只是好玩——帮你别养错。</p>
      <button onclick="next()" class="bg-orange-500 text-white font-semibold px-10 py-3.5 rounded-full shadow-sm active:scale-95 transition">开始测试</button>
      <p class="text-stone-300 text-xs mt-8">逻辑测试原型 · 视觉后续再做</p>
    </div>`;
}

function renderQuestion(){
  const q = QUESTIONS[step];
  const prog = Math.round((step)/QUESTIONS.length*100);
  app.innerHTML = `
    <div class="fade">
      <div class="h-1 bg-stone-200 rounded-full mb-8 overflow-hidden">
        <div class="h-full bg-orange-400 rounded-full transition-all" style="width:${prog}%"></div>
      </div>
      <div class="text-stone-400 text-sm mb-2">第 ${step+1} / ${QUESTIONS.length} 题</div>
      <h2 class="text-xl font-bold mb-1.5 leading-snug">${q.text}</h2>
      <p class="text-stone-400 text-sm mb-6">${q.subtitle||""}</p>
      <div class="space-y-3">
        ${q.options.map((o,i)=>`
          <button onclick="pick('${q.id}',${i})"
            class="w-full text-left px-5 py-4 rounded-2xl border bg-white border-stone-200 hover:border-orange-400 hover:bg-orange-50 active:scale-[.99] transition text-[15px] leading-relaxed">
            ${o.label}
          </button>`).join("")}
      </div>
      ${step>0?`<button onclick="back()" class="text-stone-400 text-sm mt-6">← 上一题</button>`:""}
    </div>`;
}

function renderResult(){
  const r = match(picks);
  const best = r.top[0];
  const tagBlock = `
    <div class="bg-gradient-to-br from-orange-100 to-amber-50 rounded-3xl p-6 text-center mb-6">
      <div class="text-stone-500 text-sm mb-1">你的养宠人格</div>
      <div class="text-2xl font-bold text-orange-600 mb-1">${r.tag.tag}</div>
      <div class="text-stone-500 text-sm">${r.tag.line}</div>
    </div>`;
  const card = (m, isBest)=>{
    const why = m.why;
    return `
    <div class="bg-white rounded-3xl p-5 border ${isBest?'border-orange-300 shadow-sm':'border-stone-200'} mb-4">
      ${isBest?`<div class="inline-block text-xs bg-orange-500 text-white px-2.5 py-0.5 rounded-full mb-2">最佳匹配</div>`:""}
      <div class="flex items-baseline justify-between mb-1">
        <h3 class="text-lg font-bold">${m.dog.name}</h3>
        <span class="text-orange-500 font-bold">${m.score}<span class="text-xs text-stone-400 font-normal"> 分</span></span>
      </div>
      <p class="text-stone-600 text-sm mb-3 leading-relaxed">${m.dog.one_liner}</p>
      <div class="space-y-1.5 text-sm">
        ${why.good.map(g=>`<div class="text-emerald-600">✓ ${g}</div>`).join("")}
        ${why.warn?`<div class="text-amber-600">⚠ ${why.warn}</div>`:""}
      </div>
      <div class="mt-3 pt-3 border-t border-stone-100 text-stone-400 text-xs leading-relaxed">说句实话：${why.real_talk}</div>
    </div>`;
  };
  app.innerHTML = `
    <div class="fade">
      ${tagBlock}
      ${r.relaxed?`<div class="text-amber-500 text-xs mb-3 text-center">符合所有硬条件的狗不多，已为你适当放宽</div>`:""}
      ${card(best, true)}
      <div class="text-stone-400 text-sm mb-2 mt-6">你可能也会喜欢</div>
      ${r.top.slice(1).map(m=>card(m,false)).join("")}
      <button onclick="reset()" class="w-full mt-4 border border-stone-300 text-stone-600 py-3 rounded-full active:scale-95 transition">重新测一次</button>
      <details class="mt-6 text-xs text-stone-400">
        <summary class="cursor-pointer">🔧 调试：候选池 ${r.poolSize} 只 / 看分数明细</summary>
        <pre class="mt-2 bg-stone-100 p-3 rounded-lg overflow-x-auto">${r.top.map(m=>m.dog.name+": "+m.score+"  "+m.detail.map(d=>DIM_LABEL[d.key]+"gap"+d.gap).join(" ")).join("\n")}</pre>
      </details>
    </div>`;
}

window.next = ()=>{ step++; render(); };
window.back = ()=>{ step--; render(); };
window.reset = ()=>{ picks={}; step=-1; render(); };
window.pick = (qid,i)=>{ picks[qid]=i; step++; render(); };
render();
</script>
</body>
